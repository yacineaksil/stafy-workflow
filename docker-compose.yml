services:

  # ── LLM local gratuit ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: stafy-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Application Stafy ──────────────────────────────────────────────────────
  stafy:
    build: .
    container_name: stafy-app
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      STAFY_DB_PATH: /data/stafy.db
    volumes:
      - stafy_data:/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Reverse proxy + SSL ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: stafy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/stafy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - stafy
    restart: unless-stopped

volumes:
  ollama_data:
  stafy_data:
